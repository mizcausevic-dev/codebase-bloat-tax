[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Private OAuth is opt-in via env. The static app works without it.
# Server-only secrets (never VITE_*):
#   GITHUB_OAUTH_CLIENT_SECRET
#   GITHUB_OAUTH_REDIRECT_URI
# Public:
#   VITE_GITHUB_OAUTH_CLIENT_ID
#   VITE_GITHUB_OAUTH_ENABLED=true
